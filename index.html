<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .chat {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .bot {
            background: #111827;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .user {
            background: #e5e7eb;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🤖 NEXORA AI</h1>
        <p>Asistente virtual inteligente</p>
    </div>

    <div class="container">

        <h2>💈 Barbería Nova</h2>

        <div class="chat">

            <div class="bot">
                ¡Hola! 👋 Soy NEXORA, el asistente virtual de Barbería Nova.
                ¿En qué puedo ayudarte?
            </div>

            <div class="user">
                Quiero saber cuánto cuesta el corte.
            </div>

            <div class="bot">
                ✂️ El corte tradicional tiene un valor de $25.000.
                ¿Quieres que te ayude a reservar una cita?
            </div>

        </div>

        <br>

        <input type="text" placeholder="Escribe tu mensaje...">

        <button>Enviar</button>

    </div>

</body>
</html>
