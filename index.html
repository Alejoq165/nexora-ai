<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-top: 0;
        }

        .chat {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .bot {
            background: #111827;
            color: white;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .user {
            background: #e5e7eb;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🤖 NEXORA AI</h1>
        <p>Asistente virtual inteligente</p>
    </div>

    <div class="container">

        <h2>💈 Barbería Nova</h2>

        <div class="chat">

            <div class="bot">
                ¡Hola! 👋 Soy NEXORA, el asistente virtual de Barbería Nova.
                ¿En qué puedo ayudarte?
            </div>

            <div class="user">
                Quiero saber cuánto cuesta el corte.
            </div>

            <div class="bot">
                ✂️ El corte tradicional tiene un valor de $25.000.
                ¿Quieres que te ayude a reservar una cita?
            </div>

        </div>

        <br>

        <input type="text" placeholder="Escribe tu mensaje...">

        <button>Enviar</button>

    </div>
<script>
        const input = document.querySelector("input");
            const button = document.querySelector("button");
                const chat = document.querySelector(".chat");

                    function responder() {
                            const mensaje = input.value.trim();

                                    if (mensaje === "") return;

                                            // Mostrar mensaje del cliente
                                                    const usuario = document.createElement("div");
                                                            usuario.className = "user";
                                                                    usuario.textContent = mensaje;
                                                                            chat.appendChild(usuario);

                                                                                    input.value = "";

                                                                                            // Crear respuesta de NEXORA
                                                                                                    const bot = document.createElement("div");
                                                                                                            bot.className = "bot";

                                                                                                                    const texto = mensaje.toLowerCase();

                                                                                                                            if (texto.includes("precio") || texto.includes("cuesta") || texto.includes("costo")) {
                                                                                                                                        bot.textContent = "✂️ El corte tradicional tiene un valor de $25.000. ¿Quieres reservar una cita?";
                                                                                                                                                } 
                                                                                                                                                        else if (texto.includes("horario") || texto.includes("abre")) {
                                                                                                                                                                    bot.textContent = "🕐 Estamos disponibles de lunes a sábado de 9:00 AM a 7:00 PM.";
                                                                                                                                                                            } 
                                                                                                                                                                                    else if (texto.includes("ubicación") || texto.includes("direccion") || texto.includes("dónde")) {
                                                                                                                                                                                                bot.textContent = "📍 Estamos ubicados en Barbería Nova. Pronto podrás configurar la dirección desde el panel de NEXORA.";
                                                                                                                                                                                                        } 
                                                                                                                                                                                                                else if (texto.includes("cita") || texto.includes("reservar")) {
                                                                                                                                                                                                                            bot.textContent = "📅 ¡Claro! Puedo ayudarte a reservar una cita. Próximamente podremos conectar el sistema de reservas.";
                                                                                                                                                                                                                                    } 
                                                                                                                                                                                                                                            else if (texto.includes("hola") || texto.includes("buenas")) {
                                                                                                                                                                                                                                                        bot.textContent = "¡Hola! 👋 Soy NEXORA, el asistente virtual de Barbería Nova. ¿En qué puedo ayudarte?";
                                                                                                                                                                                                                                                                } 
                                                                                                                                                                                                                                                                        else {
                                                                                                                                                                                                                                                                                    bot.textContent = "🤖 Soy NEXORA. Todavía estoy aprendiendo, pero puedo ayudarte con precios, horarios, ubicación y reservas.";
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                    chat.appendChild(bot);

                                                                                                                                                                                                                                                                                                            // Bajar automáticamente al último mensaje
                                                                                                                                                                                                                                                                                                                    chat.scrollTop = chat.scrollHeight;
                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                            button.addEventListener("click", responder);

                                                                                                                                                                                                                                                                                                                                input.addEventListener("keydown", function(event) {
                                                                                                                                                                                                                                                                                                                                        if (event.key === "Enter") {
                                                                                                                                                                                                                                                                                                                                                    responder();
                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                });
                                                                                                                                                                                                                                                                                                                                                                </script>
</body>
</html>
